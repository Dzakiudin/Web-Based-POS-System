name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-release
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read app version
        id: app_ver
        run: |
          VERSION=$(node -p "require('./client/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies & Build Client
        env:
          VITE_API_BASE_URL: https://earthquaking-jen-faunlike.ngrok-free.dev
        run: |
          cd client
          npm ci --legacy-peer-deps || npm install
          npm run build
          npx cap sync android

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build Android Debug APK
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: toko-aznun-apk-v${{ steps.app_ver.outputs.version }}
          path: client/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release v${{ steps.app_ver.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.app_ver.outputs.version }}
          TAG: ${{ steps.app_ver.outputs.tag }}
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk "pos-system-v${VERSION}.apk"
          cp client/android/app/build/outputs/apk/debug/app-debug.apk "toko-aznun-v${VERSION}.apk"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "pos-system-v${VERSION}.apk" "toko-aznun-v${VERSION}.apk" --clobber
          else
            gh release create "${TAG}" "pos-system-v${VERSION}.apk" "toko-aznun-v${VERSION}.apk" \
              --title "TOKO AZNUN POS Pro Max ${TAG}" \
              --notes "Rilis otomatis TOKO AZNUN ${TAG}" \
              --latest
          fi
