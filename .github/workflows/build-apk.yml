name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-release
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read app version
        id: app_ver
        run: |
          VERSION=$(node -p "require('./client/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies & Build Client
        env:
          VITE_API_BASE_URL: https://earthquaking-jen-faunlike.ngrok-free.dev
        run: |
          cd client
          npm ci --legacy-peer-deps || npm install
          npm run build
          npx cap sync android

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Decode persistent Android signing keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing!" >&2
            exit 1
          fi
          KS_PATH="$RUNNER_TEMP/toko-aznun-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KS_PATH"
          chmod 600 "$KS_PATH"
          ls -lh "$KS_PATH"
          echo "keystore_path=$KS_PATH" >> "$GITHUB_OUTPUT"

      - name: Build Signed Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify APK Signature
        run: |
          APK_PATH="client/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Signed app-release.apk not found!" >&2
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK_PATH"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: toko-aznun-apk-v${{ steps.app_ver.outputs.version }}
          path: client/android/app/build/outputs/apk/release/app-release.apk

      - name: Publish APK to GitHub Release v${{ steps.app_ver.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.app_ver.outputs.version }}
          TAG: ${{ steps.app_ver.outputs.tag }}
        run: |
          APK_PATH="client/android/app/build/outputs/apk/release/app-release.apk"
          cp "$APK_PATH" "pos-system-v${VERSION}.apk"
          cp "$APK_PATH" "toko-aznun-v${VERSION}.apk"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "pos-system-v${VERSION}.apk" "toko-aznun-v${VERSION}.apk" --clobber
          else
            gh release create "${TAG}" "pos-system-v${VERSION}.apk" "toko-aznun-v${VERSION}.apk" \
              --title "TOKO AZNUN POS Pro Max ${TAG}" \
              --notes "Rilis otomatis TOKO AZNUN ${TAG} (Signed APK)" \
              --latest
          fi
